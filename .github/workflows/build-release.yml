name: build-release

# 构建 + 发布 dsh-desktop 安装包。
# - push 到 main：构建 win/mac 安装包并上传 artifact（不发布）
# - 打 tag v*.*.*：额外发布 GitHub Release（附安装包），供应用内「检查更新」使用
#
# 注意：macOS 构建在 macos  runner 上；Windows 在 windows runner 上。
# 插件源码改动需同步到 dsh-plugin-lan-access / dsh-plugin-telegram-bridge 独立仓库，
# 本工作流只负责主仓库的打包与发布。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # 手动触发（含手动补产 Intel 资产）
    inputs:
      intel_tag:
        description: "补产 Intel mac 资产时填写：要发布到的 tag（如 v0.2.7），留空则跳过发布"
        required: false
        default: ""

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package.json 里的 electronDownload.cache 指向本机开发缓存目录，
      # CI runner 上不存在；移除后 electron-builder 用默认缓存。
      - name: Neutralize local electron cache path
        run: node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));if(j.build&&j.build.electronDownload){delete j.build.electronDownload.cache;}fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - name: Prepare DSH runtime
        run: npm run prepare:runtime

      # 图标文件不入库（.gitignore），CI 上需先生成
      - name: Generate app icons
        run: npm run icon

      - name: Build app (esbuild)
        run: npm run build

      - name: Build bundled plugins
        run: node scripts/build-plugins.mjs

      - name: Package NSIS installer
        # --publish never: 只打包上传 artifact，Release 由下方 release job 统一发布
        run: npm run dist -- --publish never
        env:
          # 若需镜像 Electron/NSIS 下载可打开：
          # ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: dsh-desktop-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  build-macos-intel:
    name: Build macOS Intel (x64) (manual)
    runs-on: macos-13
    # macos-13 公共 runner 几乎排不到，长期 queued 会让整个 workflow 永远
    # 显示「未完成」；改为仅手动 workflow_dispatch 时运行（自动发版不再等待）。
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package.json 里的 electronDownload.cache 指向本机开发缓存目录，
      # CI runner 上不存在；移除后 electron-builder 用默认缓存。
      - name: Neutralize local electron cache path
        run: node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));if(j.build&&j.build.electronDownload){delete j.build.electronDownload.cache;}fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - name: Prepare DSH runtime
        run: npm run prepare:runtime

      # 图标文件不入库（.gitignore），CI 上需先生成
      - name: Generate app icons
        run: npm run icon

      - name: Build app (esbuild)
        run: npm run build

      - name: Build bundled plugins
        run: node scripts/build-plugins.mjs

      - name: Package dmg/zip (x64)
        # 只构建本机架构（x64），避免在单一 runner 上产出名不副实的 arm64 包
        run: npx electron-builder --mac --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dsh-desktop-macos-x64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-macos-arm:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package.json 里的 electronDownload.cache 指向本机开发缓存目录，
      # CI runner 上不存在；移除后 electron-builder 用默认缓存。
      - name: Neutralize local electron cache path
        run: node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));if(j.build&&j.build.electronDownload){delete j.build.electronDownload.cache;}fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - name: Prepare DSH runtime
        run: npm run prepare:runtime

      # 图标文件不入库（.gitignore），CI 上需先生成
      - name: Generate app icons
        run: npm run icon

      - name: Build app (esbuild)
        run: npm run build

      - name: Build bundled plugins
        run: node scripts/build-plugins.mjs

      - name: Package dmg/zip (arm64)
        # 只构建本机架构（arm64），产出真正的 Apple Silicon 二进制
        run: npx electron-builder --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dsh-desktop-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # 只等 Windows + arm64（Intel mac runner 稀缺，长期 queued 会阻塞发布）
    needs: [build-windows, build-macos-arm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release (tag ${{ github.ref_name }})
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.exe.blockmap
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/latest.yml
            artifacts/latest-mac.yml
          generate_release_notes: true

  # Intel mac 资产：手动 workflow_dispatch 时构建并补传到指定 tag 的 Release。
  # 注意：latest-mac.yml 由 arm64 job 唯一产出（保证自动更新只有一份）。
  release-macos-intel:
    name: Publish macOS Intel assets (manual)
    needs: [build-macos-intel]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dsh-desktop-macos-x64
          path: artifacts

      - name: Upload Intel mac assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.intel_tag }}
          generate_release_notes: false
          files: |
            artifacts/*.dmg
            artifacts/*.zip
          fail_on_unmatched_files: false
